name: Deploy showcase to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Compile the Android labs' Kotlin sources (5-lab, 6-lab, 7-lab) to WebAssembly
      - name: Build Kotlin/Wasm module
        working-directory: web/kotlin
        run: ./gradlew showcase --no-daemon

      # Mirror the repo layout so web/pyodide.toml can load ../1-lab/*.py and ../rgr/scheduling/*.py
      - name: Assemble site
        run: |
          mkdir -p _site/web _site/rgr
          cp web/*.html web/*.js web/*.py web/*.toml web/*.svg _site/web/
          cp -r web/kotlin-wasm _site/web/
          cp -r 1-lab 2-lab 3-lab 4-lab _site/
          cp -r rgr/scheduling _site/rgr/
          find _site -name '__pycache__' -prune -exec rm -rf {} +
          echo '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=./web/"><title>Embedded Systems Labs</title><link rel="icon" href="./web/icon.svg"><a href="./web/">Open the showcase</a>' > _site/index.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
